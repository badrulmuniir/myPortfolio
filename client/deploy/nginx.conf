# Example nginx server block for the static Frontend (Requirement 36.1).
# Serves client/dist with an SPA fallback to index.html and the same security headers as
# client/public/_headers (the comments there explain each CSP directive).
#
# Replace before use:
#   - server_name, root and the certificate paths
#   - https://api.example.com in connect-src: the origin of your API_Server, that is the scheme
#     and host (and port, if any) of VITE_API_BASE_URL without the /api path
#
# nginx drops server-level add_header lines in any location that has its own add_header, so
# the locations below add none.

server {
    listen 80;
    server_name portfolio.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portfolio.example.com;

    ssl_certificate     /etc/ssl/certs/portfolio.example.com.crt;
    ssl_certificate_key /etc/ssl/private/portfolio.example.com.key;

    root /var/www/portfolio/dist;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.example.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # nginx terminates TLS here, so it also sends HSTS (managed hosts send it themselves).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Hashed build assets: a missing file is a real 404, not index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback: client routes such as /projects/<slug> and /admin load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
